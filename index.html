<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gym Tracker Login</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a2e' width='100' height='100' rx='20'/><text y='65' x='50' text-anchor='middle' font-size='50'>💪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-card: #1f2940;
      --bg-elevated: #273552;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --accent: #81b29a;
      --accent-hover: #6fa088;
      --danger: #e07a5f;
      --warning: #f2cc8f;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .container {
      width: min(420px, 100%);
      background: var(--bg-card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    header {
      padding: 20px 24px;
      background: linear-gradient(135deg, var(--bg-elevated), var(--bg-card));
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(129, 178, 154, 0.15);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
    }
    main { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    /* Streak Widget */
    .streak-widget { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
    .streak-card {
      padding: 16px;
      border-radius: var(--radius);
      background: var(--bg-elevated);
      text-align: center;
      border: 2px solid transparent;
      transition: border-color 150ms ease;
    }
    .streak-card.active { border-color: var(--danger); }
    .streak-icon { font-size: 28px; margin-bottom: 4px; display: inline-block; color: var(--warning); }
    .streak-card.active .streak-icon { animation: flame 0.5s ease-in-out infinite alternate; }
    .streak-card.cold .streak-icon { opacity: 0.3; }
    @keyframes flame {
      from { transform: scale(1) rotate(-2deg); }
      to { transform: scale(1.1) rotate(2deg); }
    }
    .streak-count { font-size: 26px; font-weight: 700; color: var(--danger); line-height: 1; }
    .streak-card.cold .streak-count { color: var(--text-secondary); opacity: 0.5; }
    .streak-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .streak-user { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }

    /* Login Form */
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    label { font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid var(--bg-elevated);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 150ms ease, background 150ms ease;
    }
    input[type="email"]:focus, input[type="password"]:focus { border-color: var(--accent); background: var(--bg-secondary); }
    .login-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease;
      box-shadow: 0 6px 20px rgba(129, 178, 154, 0.25);
      font-family: inherit;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(129, 178, 154, 0.35); }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(224, 122, 95, 0.15);
      color: var(--danger);
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .error-msg.show { display: block; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 20px;
      border-radius: 12px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      display: none;
      z-index: 11;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toast.error { background: var(--danger); }

    /* Install Banner */
    .install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      padding: 16px 20px;
      display: none;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
    }
    .install-banner.show { display: flex; }
    .install-banner-text { flex: 1; }
    .install-banner-text strong { display: block; font-size: 14px; color: var(--text-primary); }
    .install-banner-text span { font-size: 12px; color: var(--text-secondary); }
    .install-banner-btn {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .install-banner-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .container { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gym Tracker</h1>
      <div class="chip">Secure Login</div>
    </header>
    <main>
      <div class="streak-widget">
        <div class="streak-card cold" id="streak-user1">
          <div class="streak-user" id="streak-name-user1">Deniz</div>
          <div class="streak-icon">*</div>
          <div class="streak-count" id="streak-count-user1">0</div>
          <div class="streak-label">day streak</div>
        </div>
        <div class="streak-card cold" id="streak-user2">
          <div class="streak-user" id="streak-name-user2">Bogi</div>
          <div class="streak-icon">*</div>
          <div class="streak-count" id="streak-count-user2">0</div>
          <div class="streak-label">day streak</div>
        </div>
      </div>
      
      <form class="login-form" id="login-form">
        <div>
          <label for="email-input">Email</label>
          <input type="email" id="email-input" placeholder="Enter your email" autocomplete="email" required>
        </div>
        <div>
          <label for="password-input">Password</label>
          <input type="password" id="password-input" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div class="error-msg" id="error-msg">Invalid email or password</div>
        <button type="submit" class="login-btn" id="login-btn">Log In</button>
      </form>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Install Banner -->
  <div class="install-banner" id="install-banner">
    <div class="install-banner-text">
      <strong>Add to Home Screen</strong>
      <span>Tap Share then "Add to Home Screen"</span>
    </div>
    <button class="install-banner-btn" id="install-btn">How</button>
    <button class="install-banner-close" id="install-close">x</button>
  </div>

  <script type="module">
    import { db, auth, doc, getDoc, collection, query, where, getDocs, signInWithEmailAndPassword, onAuthStateChanged } from './firebase-config.js';

    // Map Firebase Auth emails to user IDs
    const EMAIL_TO_USER = {
      'denizyeni@denizyeni.com': 'user1',
      'bogi@bogi.com': 'user2'
    };

    const DEFAULT_NAMES = { user1: 'Deniz', user2: 'Bogi' };
    let names = { ...DEFAULT_NAMES };

    const $ = id => document.getElementById(id);
    const form = $('login-form');
    const emailInput = $('email-input');
    const passwordInput = $('password-input');
    const loginBtn = $('login-btn');
    const errorMsg = $('error-msg');
    const toastEl = $('toast');

    function showToast(msg, isError) {
      toastEl.textContent = msg;
      toastEl.classList.toggle('error', Boolean(isError));
      toastEl.style.display = 'block';
      setTimeout(() => { toastEl.style.display = 'none'; }, 2500);
    }

    function updateStreakNames() {
      $('streak-name-user1').textContent = names.user1;
      $('streak-name-user2').textContent = names.user2;
    }

    // Streak calculation
    function calculateStreak(dates) {
      if (!dates.length) return 0;
      const sorted = [...dates].sort((a, b) => b.localeCompare(a));
      const today = new Date();
      const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const todayStr = fmt(today);
      
      let checkDate = new Date(today);
      if (sorted[0] !== todayStr) {
        checkDate.setDate(checkDate.getDate() - 1);
        if (sorted[0] !== fmt(checkDate)) return 0;
      }
      
      let streak = 0;
      for (let i = 0; i < 365; i++) {
        if (sorted.includes(fmt(checkDate))) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else break;
      }
      return streak;
    }

    function updateStreakUI(userId, streak) {
      const card = $(`streak-${userId}`);
      $(`streak-count-${userId}`).textContent = streak;
      card.classList.toggle('cold', streak === 0);
      card.classList.toggle('active', streak > 0);
    }

    async function loadStreaks() {
      try {
        for (const userId of ['user1', 'user2']) {
          const snap = await getDocs(query(collection(db, 'check-ins'), where('userId', '==', userId)));
          const dates = [];
          snap.forEach(doc => dates.push(doc.data().date));
          updateStreakUI(userId, calculateStreak(dates));
        }
      } catch (e) {
        console.error('Failed to load streaks:', e);
      }
    }

    async function loadNames() {
      try {
        const namesSnap = await getDoc(doc(db, 'gym-config', 'names'));
        if (namesSnap.exists()) names = { ...DEFAULT_NAMES, ...namesSnap.data() };
      } catch (e) {
        console.error('Failed to load names:', e);
      }
      updateStreakNames();
    }

    // Check if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userId = EMAIL_TO_USER[user.email];
        if (userId) {
          window.location.href = `dashboard.html?user=${userId}`;
        }
      }
    });

    // Handle login
    form.onsubmit = async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        errorMsg.textContent = 'Please enter email and password';
        errorMsg.classList.add('show');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      errorMsg.classList.remove('show');

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const userId = EMAIL_TO_USER[userCredential.user.email];
        
        if (!userId) {
          errorMsg.textContent = 'Account not authorized for this app';
          errorMsg.classList.add('show');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
          return;
        }

        showToast('Welcome back!');
        setTimeout(() => {
          window.location.href = `dashboard.html?user=${userId}`;
        }, 600);

      } catch (error) {
        console.error('Login error:', error);
        
        let message = 'Login failed. Please try again.';
        if (error.code === 'auth/invalid-email') {
          message = 'Invalid email address';
        } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          message = 'Invalid email or password';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many attempts. Try again later.';
        }

        errorMsg.textContent = message;
        errorMsg.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    };

    // Init
    loadNames();
    loadStreaks();

    // Show install banner on iOS Safari if not already installed
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    const dismissed = localStorage.getItem('installBannerDismissed');
    
    if (isIOS && !isStandalone && !dismissed) {
      setTimeout(() => $('install-banner').classList.add('show'), 2000);
    }

    // Install banner handlers
    $('install-btn').onclick = () => {
      alert('1. Tap the Share button (square with arrow)\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add" in the top right');
    };
    $('install-close').onclick = () => {
      $('install-banner').classList.remove('show');
      localStorage.setItem('installBannerDismissed', 'true');
    };
  </script>
</body>
</html>
